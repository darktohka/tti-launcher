name: Build

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-2025
            qt_arch: win64_msvc2022_64
            version: 6.10.*

          - name: linux-x64
            os: ubuntu-24.04
            qt_arch: linux_gcc_64
            version: 6.11.*

          - name: macos-x64
            os: macos-13
            qt_arch: clang_64
            version: 6.11.*

          - name: macos-arm64
            os: macos-14
            qt_arch: clang_64
            version: 6.11.*

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.qt_arch }}
          modules: ''

      - name: Install bzip2 (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libbz2-dev

      - name: Install bzip2 (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: $VCPKG_INSTALLATION_ROOT/vcpkg install bzip2:x64-windows

      - name: Configure
        shell: bash
        run: |
          cmake_args=(
            -DCMAKE_BUILD_TYPE=Release
            -DCMAKE_INSTALL_PREFIX=install
          )
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmake_args+=(
              -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
              -DVCPKG_TARGET_TRIPLET=x64-windows
            )
          fi
          cmake -S . -B build "${cmake_args[@]}"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Install
        run: cmake --install build --config Release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tti-${{ matrix.name }}
          path: install/
