name: Build

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-2025
            qt_arch: win64_msvc2022_64

          - name: linux-x64
            os: ubuntu-24.04
            qt_arch: linux_gcc_64

          - name: macos-x64
            os: macos-13
            qt_arch: clang_64

          - name: macos-arm64
            os: macos-14
            qt_arch: clang_64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.*'
          arch: ${{ matrix.qt_arch }}
          modules: ''

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=install

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Install
        run: cmake --install build --config Release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tti-${{ matrix.name }}
          path: install/
